name: Build Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci # 'ci' is faster and more strict than 'install' for runners

    - name: Build
      run: npm run build

    - name: Archive Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: portfolio-dist
        path: dist/
        retention-days: 7 # Keeps it for a week so it doesn't clutter storage
